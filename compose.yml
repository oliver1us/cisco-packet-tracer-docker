services:
  packet-tracer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: ${PUID:-1001}
        PGID: ${PGID:-1001}
        PT_DEB: CiscoPacketTracer_901_Ubuntu_64bit.deb
    image: packet-tracer:9.0
    container_name: packet-tracer
    hostname: packet-tracer
    restart: unless-stopped
    ports:
      - "5900:5900" # Native VNC (RealVNC/TigerVNC client)
    environment:
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1920}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-1080}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    volumes:
      - ./saves:/home/pt/saves
      - ./storage:/home/pt/storage
    shm_size: "512mb"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6080' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s

  # Caddy reverse proxy: adds HTTP Basic Auth and is the only service publishing 6080
  proxy:
    image: caddy:alpine
    container_name: packet-tracer-proxy
    hostname: packet-tracer-proxy
    restart: unless-stopped
    depends_on:
      - packet-tracer
    ports:
      - "6080:8080" # noVNC with Basic Auth: http://localhost:6080/vnc.html
    environment:
      HTTP_USER: ${HTTP_USER:-admin}
      HTTP_PASSWORD: ${HTTP_PASSWORD:-}
      LISTEN_PORT: "8080"
      UPSTREAM: "packet-tracer:6080"
    volumes:
      - ./proxy-entrypoint.sh:/proxy-entrypoint.sh:ro
    command: ["/bin/sh", "/proxy-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "u=$$(printf '%s' \"$$HTTP_USER:$$HTTP_PASSWORD\" | base64); wget -qO- --header=\"Authorization: Basic $$u\" http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
